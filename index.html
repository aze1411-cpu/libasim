<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libasım — Qadın libaslarının kirayəsi</title>
<meta name="description" content="Gəlinlik, xına, nişan və axşam libaslarını 3 günlük kirayə edin. Təqvimdən boş tarixi seçin, pulsuz prova edin, depozit geri qaytarılır.">
<meta property="og:title" content="Libasım — Qadın libaslarının kirayəsi">
<meta property="og:description" content="Gəlinlik, xına, nişan və axşam libaslarını 3 günlük kirayə edin. Təqvimdən boş tarixi seçin, pulsuz prova edin, depozit geri qaytarılır.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=1200&q=80">
<meta name="theme-color" content="#fbf7f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{--bg:#fbf7f6;--sf:#f7f0ef;--soft:#f4eaec;--ink:#1d1418;--mut:#6f6067;--ac:#6e1d3a;--ac-ink:#ffffff;--gold:#c39a6b;--ln:#eadfe2;--art:#f1e6e9;--dk:#241319;--dk-ink:#f8eef1;--wa:#1f7a4d;--fh:'Playfair Display',Georgia,serif;--fb:'DM Sans',system-ui,sans-serif;--hw:500;--cr:14px;--br:10px;--catn:5}
*,*::before,*::after{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.logo{font-family:var(--fh);font-weight:var(--hw,600);line-height:1.12;letter-spacing:var(--hls,-.01em)}
h1{font-size:clamp(36px,6vw,var(--h1,60px))}
h2{font-size:clamp(28px,4.2vw,var(--h2,42px))}
h3{font-size:20px}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}
.w{max-width:var(--maxw,1180px);margin:0 auto;padding:0 20px}
.narrow{max-width:820px}
section{padding:var(--sp,72px) 0}
.pt0{padding-top:0}
.mt{margin-top:36px}
.c{justify-content:center;text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);font-weight:600;margin-bottom:12px}
.lead{color:var(--mut);font-size:17px;max-width:60ch}
.note{color:var(--mut);font-size:13px;margin-top:16px}
.hint{color:var(--mut);font-size:12.5px;display:block;margin:6px 0}
.small{font-size:13px;color:var(--mut)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:99;background:var(--ink);color:var(--bg);padding:8px 14px}
.sh{margin-bottom:36px;max-width:720px}
.sh.c,.sh{}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}

/* Düymələr */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 24px;border-radius:var(--br,999px);border:1px solid transparent;font:600 14.5px var(--fb);letter-spacing:var(--bls,0);text-transform:var(--btt,none);cursor:pointer;transition:transform .2s,background .2s,color .2s,border-color .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.btn.pri:hover{box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 35%,transparent)}
.btn.line{border-color:var(--ink);color:var(--ink);background:transparent}
.btn.line:hover{background:var(--ink);color:var(--bg)}
.btn.wa{background:var(--wa,#1f7a4d);color:#fff;border-color:var(--wa,#1f7a4d)}
.btn.sm{min-height:40px;padding:0 16px;font-size:13.5px}
.btn.wide{width:100%}
.ib{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;cursor:pointer;position:relative;color:inherit;transition:background .2s}
.ib:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.ib span{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--ac);color:var(--ac-ink);font:700 10.5px/18px var(--fb);text-align:center}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.35)}}
.lnk{display:inline-flex;gap:8px;align-items:center;font-weight:600;border-bottom:1px solid currentColor;padding-bottom:3px;margin-top:20px}

/* Başlıq */
.hd{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--ln)}
.hw{display:flex;align-items:center;justify-content:space-between;gap:20px;height:68px}
.logo{font-size:26px;white-space:nowrap}
nav{display:flex;gap:26px;font-size:14px}
nav a{color:var(--mut);padding:6px 0;position:relative;transition:color .2s;white-space:nowrap}
nav a:hover,nav a.on{color:var(--ink)}
nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:var(--ac)}
nav a.ofl{color:var(--ac);font-weight:600}
.hic{display:flex;gap:4px;align-items:center}
.topbar{background:var(--dk);color:var(--dk-ink);text-align:center;font-size:12.5px;letter-spacing:.06em;padding:9px 16px}
.strip{background:var(--dk);color:var(--dk-ink);text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:18px 16px}

/* Şəkil */
.pic{position:relative;overflow:hidden;background:var(--art);isolation:isolate}
.pic::before{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font:500 54px var(--fh);color:color-mix(in srgb,var(--ink) 10%,transparent);z-index:-1;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%) var(--art);background-size:250% 100%;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .5s}

/* Kart */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gg,18px)}
.card{display:flex;flex-direction:column;gap:12px;position:relative}
.cimg{display:block;position:relative;border-radius:var(--cr,16px);overflow:hidden}
.cimg .pic{aspect-ratio:var(--car,4/5)}
.cimg .pic.alt{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.card:hover .cimg .pic.alt{opacity:1}
.card:hover .cimg img{transform:scale(1.05)}
.cb{display:flex;flex-direction:column;gap:3px}
.cm{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.card h3{font-size:var(--ch,18px);line-height:1.25}
.pr{font-weight:700;font-size:16px}
.pr small{font-weight:500;color:var(--mut);font-size:.8em}
.pr s{color:var(--mut);font-weight:400;margin-left:6px;font-size:.85em}
.pr.big{font-size:26px;margin:10px 0}
.badge{position:absolute;top:12px;left:12px;background:var(--bg);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:99px;z-index:2}
.badge.sale{background:var(--ac);color:var(--ac-ink)}
.tag{display:inline-block;font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);margin:4px 4px 0 0}
.empty{border:1px dashed var(--ln);border-radius:var(--cr,16px);padding:28px;color:var(--mut);text-align:center;grid-column:1/-1}

/* Ana səhifə blokları */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{border:1px solid var(--ln);background:var(--sf);border-radius:var(--cr,16px);padding:26px 16px;text-align:center;font:600 20px var(--fh);transition:border-color .2s,transform .2s}
.cat:hover{border-color:var(--ac);transform:translateY(-3px)}
.ben{display:grid;gap:18px}
.ben div{border-top:1px solid var(--ln);padding-top:16px}
.ben b{display:block;font:600 20px var(--fh);margin-bottom:4px}
.ben span{color:var(--mut);font-size:14px}
.camps{display:grid;gap:16px}
.camp{position:relative;min-height:320px;border-radius:var(--cr,16px);overflow:hidden;display:flex;align-items:flex-end;color:#fff}
.camp .pic{position:absolute;inset:0}
.camp::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent 70%)}
.camp>div{position:relative;z-index:1;padding:26px}
.camp h3{font-size:28px;margin-bottom:6px}.camp p{font-size:14px;opacity:.9;margin-bottom:10px}
.camp span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #fff;padding-bottom:3px}
.camp:hover img{transform:scale(1.05)}
.steps{display:grid;gap:16px}
.step{background:var(--sf);border:1px solid var(--ln);border-radius:var(--cr,16px);padding:26px}
.step i{font-style:normal;display:inline-grid;place-items:center;min-width:38px;height:38px;border-radius:99px;background:var(--ac);color:var(--ac-ink);font-weight:700;margin-bottom:14px;padding:0 10px}
.step b{display:block;font:600 21px var(--fh);margin-bottom:6px}
.step span{color:var(--mut);font-size:14.5px}
.band{background:var(--sf);border:1px solid var(--ln);border-radius:var(--cr,20px);padding:48px 24px;text-align:center}
.band p{color:var(--mut);margin:10px auto 24px;max-width:52ch}
.revs{display:grid;gap:16px}
.rev{background:var(--sf);border:1px solid var(--ln);border-radius:var(--cr,16px);padding:26px;display:flex;flex-direction:column;gap:12px}
.stars{color:var(--gold,var(--ac));letter-spacing:3px;font-size:14px}
.rev blockquote{font:500 19px/1.45 var(--fh)}
.rev figcaption{color:var(--mut);font-size:13px}
.faq{display:grid;gap:10px}
.faq details{border:1px solid var(--ln);border-radius:var(--cr,14px);background:var(--sf);padding:0 20px}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{font-style:normal;font-size:22px;line-height:1;color:var(--ac);transition:transform .25s}
.faq details[open] summary i{transform:rotate(45deg)}
.faq p{color:var(--mut);padding:0 0 18px}
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.mem{display:flex;flex-direction:column;gap:4px}
.mem .pic{aspect-ratio:3/4;border-radius:var(--cr,16px);margin-bottom:10px}
.mem b{font:600 19px var(--fh)}.mem span{color:var(--mut);font-size:13.5px}
.mem:hover img{transform:scale(1.04)}
.vals{display:grid;gap:14px;margin:24px 0}
.vals div{border-left:2px solid var(--ac);padding-left:14px}
.vals b{display:block;font-weight:600}.vals span{color:var(--mut);font-size:14px}

/* Səhifələr */
.pg{padding:48px 0 80px}
.ph{margin-bottom:28px}
.ph h1{margin-bottom:10px}
.crumb{display:inline-block;font-size:13.5px;color:var(--mut);margin-bottom:22px}
.crumb:hover{color:var(--ink)}
.chips,.tchips,.rchips,.ochips{display:flex;gap:8px;flex-wrap:wrap}
.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font:500 14px var(--fb);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;font-size:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.cnt{color:var(--mut);font-size:14px;margin-right:auto}
.sel,.inp{min-height:44px;border:1px solid var(--ln);background:var(--sf);border-radius:var(--ir,10px);padding:0 14px;font-size:15px;width:auto;transition:border-color .2s}
.inp{width:100%}
textarea.inp{padding:12px 14px;resize:vertical}
.inp:focus,.sel:focus{outline:none;border-color:var(--ac)}
.pd{display:grid;gap:36px}
.pdi .pic{aspect-ratio:4/5;border-radius:var(--cr,16px)}
.pdt h1{font-size:clamp(32px,4.5vw,46px);margin-top:6px}
.desc{color:var(--mut);margin:12px 0}
.opt{margin:18px 0}
.opt>b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.pda{display:flex;gap:10px;margin:22px 0 10px}
.q{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:99px;padding:2px}
.q button{width:34px;height:34px;border:0;background:none;font-size:17px;cursor:pointer;border-radius:50%}
.q button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.q span{min-width:22px;text-align:center;font-weight:600}
.info{list-style:none;padding:18px 0 0;margin-top:18px;border-top:1px solid var(--ln);display:grid;gap:10px;font-size:14px;color:var(--mut)}
.info li{display:flex;gap:10px}.info svg{width:18px;height:18px;color:var(--ac);margin-top:2px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.thumbs button{border:1px solid transparent;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;opacity:.6}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs .pic{aspect-ratio:1}
.ab{display:grid;gap:40px;align-items:center}
.ab h1{margin-bottom:18px}
.ab .lead{margin-bottom:14px}
.abi{aspect-ratio:4/5;border-radius:var(--cr,16px)}
.ct{display:grid;gap:40px}
.ct h1{margin-bottom:14px}
.clist{list-style:none;padding:0;margin:24px 0;display:grid;gap:0;border-top:1px solid var(--ln)}
.clist li{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--ln);font-size:15px}
.clist b{font-weight:600}.clist span{color:var(--mut)}
.map{border-radius:var(--cr,16px);overflow:hidden;min-height:360px;border:1px solid var(--ln)}
.map iframe{width:100%;height:100%;min-height:360px;border:0;filter:grayscale(.3)}
.iblocks{display:grid;gap:14px;margin-top:24px}
.ib2{background:var(--sf);border:1px solid var(--ln);border-radius:var(--cr,14px);padding:22px}
.ib2 h3{margin-bottom:6px}.ib2 p{color:var(--mut)}

/* Səbət */
#ov{position:fixed;inset:0;background:rgba(10,8,6,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.op #ov,.so #ov,.dr #ov,.mo #ov,.fo #ov{opacity:1;pointer-events:auto}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--bg);z-index:61;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;padding:20px}
.op #cart{transform:none}
.cth{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.cth h3{font-size:26px}
#cl{flex:1;overflow:auto}
.ci{display:grid;grid-template-columns:68px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln)}
.ci .pic{aspect-ratio:1;border-radius:10px}
.ci b{display:block;font-size:15px}.ci small{display:block;color:var(--mut);font-size:12.5px}
.ci .q{margin-top:6px}.ci .q button{width:28px;height:28px}
.rmv{border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px;padding:4px 0}
#cf{padding-top:12px;display:grid;gap:8px}
.tt{display:flex;justify-content:space-between;font-size:18px}
#cart .empty{margin-top:20px}

/* Axtarış */
.srch{position:fixed;inset:0 0 auto;z-index:62;background:var(--bg);padding:22px 0 26px;transform:translateY(-105%);transition:transform .35s cubic-bezier(.2,.7,.2,1);box-shadow:0 20px 50px rgba(0,0,0,.15);max-height:90vh;overflow:auto}
.so .srch{transform:none}
.sbx{display:flex;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.sbx input{flex:1;border:0;background:none;font:400 22px var(--fh);outline:none;min-width:0}
#sr{display:grid;gap:4px;margin-top:16px}
.sri{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:8px;border-radius:12px}
.sri:hover{background:var(--sf)}
.sri .pic{aspect-ratio:1;border-radius:8px}
.sri b{display:block;font-size:15px}.sri small{color:var(--mut);font-size:12.5px}.sri em{font-style:normal;font-weight:600;font-size:14px}

/* Forma */
.co{display:grid;gap:28px;margin-top:24px;align-items:start}
.form{display:grid;gap:22px}
.fgrid{display:grid;gap:16px}
.fld{display:grid;gap:7px}
.fld label{font-size:13.5px;font-weight:600}
.fld .err{color:#c0392b;font-size:12.5px;font-style:normal;min-height:0}
.fld.bad .inp{border-color:#c0392b}
.pay{display:grid;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:var(--cr,14px);padding:18px}
.ck{display:flex;align-items:center;gap:10px;font-size:14.5px;cursor:pointer;padding:3px 0}
.ck input{accent-color:var(--ac);width:18px;height:18px}
.ck em{margin-left:auto;color:var(--mut);font-style:normal;font-size:12.5px}
.sum{background:var(--sf);border:1px solid var(--ln);border-radius:var(--cr,16px);padding:22px;position:sticky;top:90px}
.sum h3{margin-bottom:12px}
.sl2{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}
.sl2 .pic{aspect-ratio:1;border-radius:8px}.sl2 small{display:block;color:var(--mut);font-size:12px}
.cpn{display:flex;gap:8px;margin-top:14px}
.tot{display:grid;gap:8px;margin-top:14px;font-size:14.5px}
.tot div{display:flex;justify-content:space-between}
.tot .ok{color:var(--wa,#1f7a4d)}
.tot .g{font-weight:700;font-size:19px;border-top:1px solid var(--ln);padding-top:12px;margin-top:4px}
.slots{display:grid;gap:12px}
.sdays{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.sday{flex:none;width:64px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 4px;display:grid;gap:0;text-align:center;cursor:pointer;transition:all .2s}
.sday b{font-size:20px;line-height:1.2}.sday small{font-size:11px;color:var(--mut)}
.sday.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.sday.on small{color:inherit;opacity:.75}
.stimes{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.stime{border:1px solid var(--ln);background:var(--sf);border-radius:10px;min-height:44px;cursor:pointer;font-weight:600;display:grid;place-items:center;line-height:1.1;transition:all .2s}
.stime small{font-size:10.5px;font-weight:500;color:var(--mut)}
.stime:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.stime.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.stime:not(:disabled):hover{border-color:var(--ink)}
.wiz{list-style:none;padding:0;display:flex;gap:8px;margin:22px 0 4px;counter-reset:s}
.wiz li{flex:1;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut);padding-bottom:12px;border-bottom:2px solid var(--ln)}
.wiz li i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);font-size:13px;font-weight:700}
.wiz li.on{color:var(--ink);border-color:var(--ac)}.wiz li.on i{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.wiz li.done{color:var(--ink);border-color:var(--ink)}.wiz li.done i{background:var(--ink);color:var(--bg)}
.wbtn{justify-content:space-between}
.rvw{display:grid;gap:0;border:1px solid var(--ln);border-radius:var(--cr,14px);overflow:hidden}
.rvw div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--ln);font-size:14.5px}
.rvw div:last-child{border:0}.rvw span{color:var(--mut)}
.done{text-align:center}
.okc{width:76px;height:76px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin:0 auto 22px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.okc svg{width:38px;height:38px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.done .lead{margin:12px auto 24px}
.dbox{display:flex;justify-content:center;gap:40px;margin:0 auto 24px;padding:20px;border:1px solid var(--ln);border-radius:var(--cr,14px);max-width:440px;background:var(--sf)}
.dbox span{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}.dbox b{font-size:22px}
.done>p{color:var(--mut);margin-bottom:18px}

/* Təklif */
.offer .oh{display:grid;gap:28px;align-items:center;margin-bottom:28px}
.offer h1{margin-bottom:14px}
.opc{background:var(--dk);color:var(--dk-ink);border-radius:var(--cr,20px);padding:30px}
.opc small{letter-spacing:.16em;text-transform:uppercase;font-size:12px;opacity:.75}
.amt{font:600 64px/1 var(--fh);margin:8px 0}.amt span{font-size:22px;opacity:.7}
.opc p{opacity:.8;font-size:14px;margin-bottom:18px}
.opc .btn.pri{background:var(--dk-ink);color:var(--dk);border-color:var(--dk-ink)}
.tlinks{display:grid;gap:12px;margin:10px 0 40px}
.tlink{border:1px solid var(--ln);background:var(--sf);border-radius:var(--cr,16px);padding:18px 20px;display:grid;gap:2px;transition:border-color .2s,transform .2s}
.tlink:hover{transform:translateY(-3px);border-color:var(--ink)}
.tlink.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.tlink small{letter-spacing:.14em;font-size:11.5px;color:var(--ac);font-weight:700}
.tlink b{font:600 26px var(--fh)}.tlink span{color:var(--mut);font-size:13.5px}.tlink em{font-style:normal;font-size:13px;font-weight:600;margin-top:6px}
.two{display:grid;gap:32px}
.two h2,.offer>div>h2{font-size:28px;margin-bottom:16px}
.ckl{list-style:none;padding:0;display:grid;gap:10px}
.ckl li{padding-left:28px;position:relative;font-size:15px}
.ckl li::before{content:"✓";position:absolute;left:0;color:var(--ac);font-weight:700}
.ckl.no li::before{content:"—";color:var(--mut)}
.osteps{display:grid;gap:12px}
.osteps div{border-top:2px solid var(--ac);padding-top:14px}
.osteps i{font-style:normal;color:var(--ac);font-weight:700;font-size:13px}
.osteps b{display:block;font:600 19px var(--fh);margin:4px 0}.osteps span{color:var(--mut);font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--ln);border-radius:var(--cr,14px)}
.tbl table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:560px}
.tbl th,.tbl td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--ln)}
.tbl th{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:center}
.tbl .hl{background:color-mix(in srgb,var(--ac) 9%,transparent);font-weight:600}

/* Footer */
.ft{border-top:1px solid var(--ln);padding:44px 0 110px;color:var(--mut);font-size:14px}
.ft p{margin-bottom:6px}
.ft a:hover{color:var(--ink)}
.ofl{color:var(--ac)!important;font-weight:600}
.fgrid2{display:grid;gap:28px}
.fgrid2>div{display:flex;flex-direction:column;gap:8px}
.fgrid2 b{color:var(--ink);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.fgrid2 .logo{color:var(--ink);font-size:28px;margin-bottom:6px}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid var(--ln);margin-top:32px;padding-top:20px;font-size:12.5px}
.fab{position:fixed;right:18px;bottom:18px;z-index:50;display:inline-flex;align-items:center;gap:8px;background:var(--wa,#1f7a4d);color:#fff;border-radius:99px;padding:13px 18px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s}
.fab:hover{transform:translateY(-3px)}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:14px;z-index:90;opacity:0;transition:all .3s;pointer-events:none}
#toast.s{opacity:1;transform:translate(-50%,0)}

/* Animasiya */
.view{animation:vin .45s ease}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}

@media(max-width:860px){
 .hw{flex-wrap:wrap;height:auto;padding-top:12px;row-gap:4px}
 .hd nav{order:3;width:100%;overflow-x:auto;gap:20px;padding-bottom:8px;white-space:nowrap;scrollbar-width:none;font-size:13px}
 .hd nav::-webkit-scrollbar{display:none}
 .fab span{display:none}.fab{padding:14px}
}
@media(min-width:720px){
 .grid{grid-template-columns:repeat(3,1fr)}
 .cats{grid-template-columns:repeat(var(--catn,5),1fr)}
 .ben{grid-template-columns:repeat(4,1fr)}
 .camps{grid-template-columns:1fr 1fr}
 .steps{grid-template-columns:repeat(3,1fr)}
 .revs{grid-template-columns:repeat(3,1fr)}
 .team{grid-template-columns:repeat(4,1fr)}
 .pd{grid-template-columns:1.05fr 1fr;gap:56px}
 .ab,.ct{grid-template-columns:1fr 1fr;gap:56px}
 .fgrid{grid-template-columns:1fr 1fr}.fld.full{grid-column:1/-1}
 .co{grid-template-columns:1.4fr 1fr}
 .offer .oh{grid-template-columns:1.4fr 1fr}
 .tlinks{grid-template-columns:repeat(3,1fr)}
 .two{grid-template-columns:1fr 1fr;gap:48px}
 .osteps{grid-template-columns:repeat(5,1fr)}
 .fgrid2{grid-template-columns:1.6fr 1fr 1fr 1fr}
}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.co>*,.bq>*,.shop>*,.pd>*,.fgrid>*,.ab>*,.ct>*,.two>*,.hgrid>*,.story>*,.sgrid>*,.ngrid>*,.pgrid>*{min-width:0}
.bar{flex-wrap:wrap}.bar .sel{flex:1 1 170px;max-width:100%}.cnt{white-space:nowrap}
@media(max-width:600px){.bar .sel{flex-basis:100%;order:3}}
.grid>*,.rail>*{min-width:0}.card h3{overflow-wrap:break-word;hyphens:auto}

/* ===== Komponentlər və dizayn variantları (bütün paketlər) ===== */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn.gold{background:var(--gold,var(--ac));color:var(--gold-ink,var(--ac-ink));border-color:var(--gold,var(--ac))}
.btn.ghost{border-color:rgba(255,255,255,.7);color:#fff;background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.btn.ghost:hover{background:#fff;color:#111}
.btn.lt{background:var(--dk-ink);color:var(--dk);border-color:var(--dk-ink)}
.eyebrow.lt{color:var(--gold,var(--ac))}
.al-center .sh{text-align:center;margin-left:auto;margin-right:auto}
.al-center .sh .lead{margin:12px auto 0}
.sh.lt h2{color:var(--dk-ink)}
.soft{background:var(--soft,var(--sf))}
.dark{background:var(--dk);color:var(--dk-ink)}
.dark .cm,.dark .pr small,.dark .pr s{color:color-mix(in srgb,var(--dk-ink) 60%,transparent)}
.dark .btn.pri{background:var(--gold,var(--dk-ink));border-color:var(--gold,var(--dk-ink));color:var(--gold-ink,var(--dk))}
.dark .badge{background:var(--gold,var(--dk-ink));color:var(--gold-ink,var(--dk))}
.dark .btn.line{border-color:var(--dk-ink);color:var(--dk-ink)}
.dark .empty{border-color:color-mix(in srgb,var(--dk-ink) 25%,transparent)}

/* ----- Başlıq variantları ----- */
.hd-center .hw{display:grid;grid-template-columns:1fr auto 1fr;height:auto;padding-top:14px;row-gap:2px;align-items:center}
.hd-center .logo{grid-column:2;grid-row:1;font-size:32px;text-align:center}
.hd-center .hic,.hd-center .bb{grid-column:3;grid-row:1;justify-self:end}
.hd-center .mb{grid-column:1;grid-row:1;justify-self:start}
.hd-center .hd nav{grid-column:1/-1;grid-row:2;justify-content:center;padding:2px 0 12px}
.hd-pill .hd{top:12px;margin:12px auto 0;width:calc(100% - 24px);max-width:1220px;border:1px solid var(--ln);border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.08)}
.hd-pill .hw{height:62px}
.hd-bar .hd{background:var(--dk);color:var(--dk-ink);border-color:transparent;backdrop-filter:none}
.hd-bar .hd nav a{color:color-mix(in srgb,var(--dk-ink) 68%,transparent)}
.hd-bar .hd nav a:hover,.hd-bar .hd nav a.on{color:var(--dk-ink)}
.hd-bar .hd nav a.on::after{background:var(--gold,var(--dk-ink))}
.hd-bar .hd nav a.ofl{color:var(--gold,var(--dk-ink))!important}
.hd-bar .hd .btn.line{border-color:var(--dk-ink);color:var(--dk-ink)}
.hd-bar .hd .ib:hover{background:rgba(255,255,255,.12)}
.hd-bar .topbar{background:var(--ac);color:var(--ac-ink)}
/* üstə düşən şəffaf başlıq (tam ekran hero-larda) */
body.ovh .hd{position:fixed;left:0;right:0;top:0;background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;color:#fff;box-shadow:none;transition:background .4s,color .4s,border-color .4s}
body.ovh.hd-pill .hd{left:12px;right:12px;top:12px;width:auto}
body.ovh .hd:not(.solid) nav a{color:rgba(255,255,255,.82)}
body.ovh .hd:not(.solid) nav a:hover,body.ovh .hd:not(.solid) nav a.on{color:#fff}
body.ovh .hd:not(.solid) nav a.ofl{color:var(--gold,#fff)!important}
body.ovh .hd:not(.solid) .btn.line{border-color:#fff;color:#fff}
body.ovh .hd:not(.solid) .ib:hover{background:rgba(255,255,255,.14)}
body.ovh .hd.solid{background:color-mix(in srgb,var(--bg) 94%,transparent);color:var(--ink);border-color:var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.ovh.hd-bar .hd.solid{background:var(--dk);color:var(--dk-ink)}
body.ovh .topbar{display:none}

/* ----- Hero ümumi ----- */
.hero{position:relative;overflow:hidden}
.hero h1{margin-bottom:18px}
.htxt p,.hero .hp2{color:var(--mut);font-size:17px;max-width:48ch;margin-bottom:26px;line-height:1.75}
.hgrid{display:grid;gap:40px;align-items:center}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,.1) 35%,rgba(0,0,0,.62) 100%),linear-gradient(90deg,rgba(0,0,0,.4),transparent 65%);z-index:1}
.hero .bg{position:absolute;inset:0;background:var(--dk)}
.hero .bg::before,.slides .pic::before{display:none}
.hpts{list-style:none;padding:0;margin-top:28px;display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px;font-weight:600}
.hpts li{display:flex;align-items:center;gap:8px}.hpts svg{width:18px;height:18px;color:var(--ac);stroke-width:2.4}
.wd{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.wd>span{display:inline-block;transform:translateY(105%);animation:wup 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.07s + .15s)}
@keyframes wup{to{transform:none}}
.hero h1 em{font-style:italic;color:var(--ac)}
/* 1 split */
.hv-split{padding:56px 0 64px;background:linear-gradient(115deg,var(--hero-a,var(--bg)),var(--hero-b,var(--soft,var(--sf))))}
.hv-split h1{max-width:15ch}
.collage{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:180px 180px;gap:12px}
.collage .pic{border-radius:var(--cr,16px)}
.collage .pic:first-child{grid-row:span 2}
/* 2 float */
.hv-float{padding:48px 0 72px}
.hv-float::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 14%,transparent),transparent 70%);right:-160px;top:-180px}
.hv-float h1{max-width:14ch}
.hvis{position:relative;padding:0 0 40px 0}
.hvis .main{aspect-ratio:4/4.4;border-radius:calc(var(--cr,16px)*1.6)}
.hvis .float{position:absolute;width:42%;aspect-ratio:3/4;left:-6%;bottom:0;border-radius:var(--cr,16px);border:6px solid var(--bg);box-shadow:0 24px 50px rgba(0,0,0,.18)}
.hcard{position:absolute;right:-4px;top:26px;background:var(--bg);border-radius:14px;padding:14px 18px;box-shadow:0 18px 40px rgba(0,0,0,.14);display:grid;gap:2px;animation:fl 5s ease-in-out infinite}
.hcard b{font-size:15px}.hcard span{font-size:12.5px;color:var(--mut)}
@keyframes fl{50%{transform:translateY(-8px)}}
/* 3 slides */
.hv-slides{height:100vh;min-height:620px;max-height:980px;color:#fff;display:flex;align-items:flex-end;padding:0 0 110px;background:var(--dk)}
.slides,.slides .sl{position:absolute;inset:0}
.slides .sl{opacity:0;transition:opacity 1.6s ease}
.slides .sl.on{opacity:1}
.slides .pic{position:absolute;inset:0;background:var(--dk)}
.slides .sl.on img{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.14)}to{transform:scale(1)}}
.hin{position:relative;z-index:2;width:100%}
.hv-slides h1{font-size:clamp(46px,8.4vw,var(--h1p,112px));font-weight:var(--hw2,500);line-height:.98;max-width:13ch;margin-bottom:22px;letter-spacing:-.02em}
.hv-slides h1 em,.hv-widget h1 em,.hv-duo h1 em{color:var(--gold,#fff)}
.hp{max-width:46ch;font-size:18px;opacity:.88;margin-bottom:34px}
.t-premium .hp,.t-premium .hin .row,.t-premium .hin .eyebrow{opacity:0;animation:fin 1s ease forwards .7s}
@keyframes fin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hdots{position:absolute;z-index:3;right:20px;bottom:116px;display:flex;flex-direction:column;gap:10px}
.hdots button{width:3px;height:30px;border:0;background:rgba(255,255,255,.35);cursor:pointer;padding:0;transition:background .3s,height .3s}
.hdots button.on{background:#fff;height:48px}
.scroll{position:absolute;z-index:3;left:50%;bottom:26px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;display:grid;justify-items:center;gap:10px;opacity:.8}
.scroll::after{content:"";width:1px;height:38px;background:linear-gradient(#fff,transparent);animation:sc 2s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* 4 center */
.hv-center{padding:72px 0 0;text-align:center}
.hv-center .hc{max-width:920px}
.hv-center h1{font-size:clamp(40px,7vw,92px);line-height:1.02}
.hv-center .hp2{margin:0 auto 28px}
.hv-center .hbtn{justify-content:center}
.hrow{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:clamp(8px,2vw,18px);margin-top:52px;align-items:end}
.hrow .pic{aspect-ratio:3/4;border-radius:var(--cr,16px) var(--cr,16px) 0 0}
.hrow .pic:nth-child(2){aspect-ratio:4/5}
/* 5 banner */
.hv-banner{min-height:90vh;display:flex;align-items:flex-end;padding:130px 0 56px;background:var(--dk)}
.hv-banner .hshade{background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,.05) 50%,rgba(0,0,0,.35))}
.hbox{position:relative;z-index:2;background:var(--bg);padding:clamp(26px,4vw,50px);max-width:620px;border-radius:var(--cr,16px);box-shadow:0 30px 60px rgba(0,0,0,.25)}
.hbox h1{font-size:clamp(34px,5vw,62px)}
.hbox p{color:var(--mut);margin-bottom:24px}
/* 6 duo */
.hv-duo{display:grid;min-height:86vh}
.dl{background:var(--dk);color:var(--dk-ink);display:flex;align-items:center;padding:64px 20px}
.din{max-width:560px;margin-left:auto;margin-right:clamp(0px,5vw,80px)}
.hv-duo h1{font-size:clamp(40px,5.6vw,76px)}
.hv-duo p{color:color-mix(in srgb,var(--dk-ink) 76%,transparent);margin-bottom:26px;max-width:46ch}
.dben{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:38px;border-top:1px solid color-mix(in srgb,var(--dk-ink) 22%,transparent);padding-top:20px}
.dben b{display:block;font:var(--hw,600) 19px var(--fh);margin-bottom:2px}.dben span{font-size:13px;opacity:.72}
.dr{min-height:52vh}
/* 7 bento */
.hv-bento{padding:26px 0 56px}
.bento{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.bento>*{border-radius:calc(var(--cr,16px)*1.3);overflow:hidden}
.btx{grid-column:1/-1;background:var(--soft,var(--sf));padding:clamp(26px,4vw,52px);display:flex;flex-direction:column;justify-content:center}
.btx h1{font-size:clamp(36px,5vw,66px)}
.b1{grid-column:1/-1;aspect-ratio:16/10}
.b2,.b3{aspect-ratio:1}
.bin{background:var(--ac);color:var(--ac-ink);padding:24px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;grid-column:1/-1;min-height:150px}
.bin b{font:var(--hw,600) 24px/1.15 var(--fh)}.bin span{opacity:.8;font-size:14px}.bin a{margin-top:12px;font-weight:700;font-size:14px}
/* 8 mag */
.hv-mag{padding:34px 0 60px}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:22px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.mtop .eyebrow{margin:0}
.hv-mag h1{font-size:clamp(46px,9.5vw,138px);line-height:.94;letter-spacing:-.035em;margin-bottom:32px}
.mgrid{display:grid;gap:24px}
.m1{aspect-ratio:4/3;border-radius:var(--cr,4px)}.m2{aspect-ratio:3/4;border-radius:var(--cr,4px)}
.mcol{display:flex;flex-direction:column;gap:18px}
.mcol .lead{font-size:17px}
.mben div{border-top:1px solid var(--ln);padding:12px 0;display:grid;grid-template-columns:auto 1fr;column-gap:12px}
.mben em{font-style:normal;color:var(--ac);font-weight:700;grid-row:span 2;font-size:13px}
.mben b{font-size:15px}.mben span{color:var(--mut);font-size:13.5px}
/* 9 circle */
.hv-circle{padding:52px 0 72px}
.cvis{position:relative;aspect-ratio:1;max-width:520px;margin:0 auto;width:100%}
.c1{position:absolute;inset:9%;border-radius:50%}
.c2{position:absolute;width:32%;aspect-ratio:1;border-radius:50%;right:0;bottom:3%;border:6px solid var(--bg);z-index:2}
.ring{position:absolute;inset:0;animation:spin 32s linear infinite}
.ring svg{width:100%;height:100%;stroke:none;fill:none}
.ring text{font:700 8.6px var(--fb);letter-spacing:.32em;text-transform:uppercase;fill:var(--ac)}
@keyframes spin{to{transform:rotate(360deg)}}
/* 10 widget */
.hv-widget{min-height:82vh;display:flex;align-items:center;padding:150px 0 90px;color:#fff;text-align:center;background:var(--dk)}
.hv-widget .hc{position:relative;z-index:2;max-width:880px}
.hv-widget h1{font-size:clamp(40px,7vw,88px);line-height:1.02}
.hv-widget .hp2{color:rgba(255,255,255,.86);margin:0 auto 30px}
.wdg{display:flex;gap:8px;background:var(--bg);padding:8px;border-radius:var(--br,999px);max-width:560px;margin:0 auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.wdg .inp{border:0;flex:1;background:transparent;color:var(--ink);min-width:0}
.wchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.wchips a{border:1px solid rgba(255,255,255,.5);padding:6px 14px;border-radius:99px;font-size:13px;transition:all .2s}
.wchips a:hover{background:#fff;color:#111}
/* 11 cards (yelpik) */
.hv-cards{padding:56px 0 84px;background:radial-gradient(ellipse at 80% 40%,color-mix(in srgb,var(--ac) 10%,transparent),transparent 60%)}
.fan{position:relative;height:440px;max-width:520px;width:100%;margin:0 auto}
.fan .pic{position:absolute;width:56%;aspect-ratio:3/4;border-radius:var(--cr,16px);box-shadow:0 24px 50px rgba(0,0,0,.18);border:6px solid var(--sf);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.fan .f2{left:0;top:44px;transform:rotate(-8deg)}
.fan .f1{right:0;top:44px;transform:rotate(8deg)}
.fan .f0{left:22%;top:0;z-index:2}

/* Kirayə təqvimi: məşğul günlər, təmizlik günü, rezerv */
window.LBK = (function () {
  const T0 = new Date(); T0.setHours(0, 0, 0, 0);
  const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
  const K = d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  const MON = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];
  const fmt = d => d.getDate() + " " + MON[d.getMonth()].toLowerCase();
  const E = () => window.VDE;
  const book = id => { const r = []; let s = 2 + (id * 5) % 6; while (s < 90) { const n = 3 + (id + s) % 3; r.push([s, n]); s += n + 3 + (id * s) % 9 } return r };
  const map = id => { const m = {}; book(id).forEach(([s, n]) => { for (let i = 0; i < n; i++) m[K(addD(T0, s + i))] = "busy"; m[K(addD(T0, s + n))] = "clean" }); return m };
  const ok = (id, st, n) => { if (st < addD(T0, 1)) return false; const m = map(id); for (let i = 0; i < n; i++) if (m[K(addD(st, i))]) return false; return m[K(addD(st, n))] !== "busy" };
  const ST = new WeakMap();
  const chip = lbl => { const b = document.querySelector(`.ochips[data-o="${lbl}"] .chip.on`); return b ? b.dataset.v : "" };
  function state(el) {
    let s = ST.get(el);
    if (!s) { const f = addD(T0, 7), m = new Date(f.getFullYear(), f.getMonth(), 1); s = { id: +el.dataset.id, start: null, month: m, dur: "3 gün", size: "", msg: "" }; ST.set(el, s) }
    if (el.dataset.lbk === "item") { s.dur = chip("Müddət") || s.dur; s.size = chip("Ölçü") || s.size }
    return s;
  }
  const days = s => parseInt(s.dur) || 3;
  function price(p, dur) { const o = (p.opts.find(o => o.label === "Müddət") || { values: [] }).values.map(v => Array.isArray(v) ? v : [v, 0]).find(v => v[0] === dur); return p.price + (o ? o[1] : 0) }
  function draw(el) {
    const e = E(); if (!e) return;
    const s = state(el), p = e.byId(s.id), n = days(s); if (!p) return;
    if (s.start && !ok(s.id, s.start, n)) s.start = null;
    if (!s.size || !p.opts[0].values.includes(s.size)) s.size = p.opts[0].values[0];
    const m = map(s.id), mo = s.month, dim = new Date(mo.getFullYear(), mo.getMonth() + 1, 0).getDate(), lead = (new Date(mo.getFullYear(), mo.getMonth(), 1).getDay() + 6) % 7;
    const sel = new Set(); if (s.start) for (let i = 0; i < n; i++) sel.add(K(addD(s.start, i)));
    const ret = s.start ? K(addD(s.start, n)) : "";
    let cal = ["B.e", "Ç.a", "Ç", "C.a", "C", "Ş", "B"].map(d => `<span class="dw">${d}</span>`).join("") + Array(lead).fill('<span class="bl"></span>').join("");
    for (let i = 1; i <= dim; i++) {
      const d = new Date(mo.getFullYear(), mo.getMonth(), i), k = K(d);
      const cls = d < addD(T0, 1) ? "x" : sel.has(k) ? "sel" : k === ret ? "ret" : (m[k] || "");
      cal += `<button type="button" class="${cls}" data-d="${d.getTime()}" aria-label="${fmt(d)}${m[k] === "busy" ? ", məşğuldur" : m[k] === "clean" ? ", təmizlik günü" : ""}">${i}</button>`;
    }
    const pg = el.dataset.lbk === "page";
    const top = pg ? `<div class="lbk-pick">${e.pic(p.img, p.name, 300)}<div><h3>${e.esc(p.name)}</h3><p class="lbk-sub">${e.CATS[p.cat]} · ${e.money(p.price)} / 3 gün · <a href="#/item/${p.id}">libasa bax</a></p></div></div>
<div class="lbk-top"><label>Libas<select class="inp" data-k="id">${e.P.map(x => `<option value="${x.id}" ${x.id === s.id ? "selected" : ""}>${e.esc(x.name)}</option>`).join("")}</select></label><label>Ölçü<select class="inp" data-k="size">${p.opts[0].values.map(z => `<option ${z === s.size ? "selected" : ""}>${z}</option>`).join("")}</select></label></div>

function upGrid() {
  const cat = V.catalog.cat;
  let l = PV.filter(p => T >= 3 ? (!st.cats.length || st.cats.includes(p.cat)) : (cat === "all" || p.cat === cat));
  if (T >= 3) {
    const q = st.q.trim().toLowerCase();
    if (q) l = l.filter(p => (p.name + " " + p.desc + " " + CATS[p.cat] + " " + p.tags.join(" ")).toLowerCase().includes(q));
    if (st.min !== "") l = l.filter(p => p.price >= +st.min); if (st.max !== "") l = l.filter(p => p.price <= +st.max);
    if (st.tags.length) l = l.filter(p => st.tags.every(t => p.tags.includes(t)));
  }
  if (st.sort === "a") l = [...l].sort((a, b) => a.price - b.price);
  if (st.sort === "d") l = [...l].sort((a, b) => b.price - a.price);
  if (st.sort === "n") l = [...l].sort((a, b) => (b.isNew || 0) - (a.isNew || 0));
  const g = $("#gr"); if (!g) return; g.innerHTML = grid(l); $("#cnt").textContent = l.length + " " + L.items; reveal();
}

<div id="ov" onclick="VD.closeAll()"></div><aside id="cart" aria-label="${L.basket}" aria-hidden="true"><div class="cth"><h3>${L.basketTitle}</h3><button class="ib" onclick="VD.tog(0)" aria-label="Bağla">${ico.x}</button></div><div id="cl"></div><div id="cf"></div></aside>
${T >= 2 ? `<div class="srch" id="srch"><div class="w"><div class="sbx">${ico.search}<input id="sq" type="search" placeholder="${C.searchPh || "Axtarın..."}" oninput="VD.sres(this.value)" aria-label="Axtar"><button class="ib" onclick="VD.srch(0)" aria-label="Bağla">${ico.x}</button></div><div id="sr"></div></div></div>` : ""}
${T >= 3 ? `<div class="modal" id="modal" onclick="if(event.target===this)VD.closeAll()"><div class="mbox" id="mbox"></div></div><div class="lbx" id="lbx" onclick="VD.closeAll()"><img id="lbi" alt=""><button class="ib" aria-label="Bağla">${ico.x}</button></div>` : ""}
<div id="toast" role="status" aria-live="polite"></div>`;
  document.body.className = `t-${TN} hd-${LK.head} cv-${LK.card} al-${LK.align} hero-${LK.hero}`;
}
function drawB() {
  const bc = $("#bc"); if (bc) bc.textContent = count();
  const cl = $("#cl"), cf = $("#cf"); if (!cl) return;
  cl.innerHTML = B.length ? B.map(l => { const p = byId(l.id); return `<div class="ci">${pic(p.img, p.name, 200)}<div><b>${esc(p.name)}</b>${optsTxt(l) ? `<small>${esc(optsTxt(l))}</small>` : ""}<small>${money(linePrice(l))}${L.per}</small>${L.qty ? `<div class="q"><button aria-label="Azalt" onclick="VD.q('${esc(l.k).replace(/'/g, "\\'")}',-1)">−</button><span>${l.q}</span><button aria-label="Artır" onclick="VD.q('${esc(l.k).replace(/'/g, "\\'")}',1)">+</button></div>` : `<button class="rmv" onclick="VD.rm('${esc(l.k).replace(/'/g, "\\'")}')">Sil</button>`}</div><span class="pr">${money(linePrice(l) * l.q)}</span></div>` }).join("") : `<div class="empty">${L.empty}</div>`;
  if (!B.length) { cf.innerHTML = ""; return }
  if (T === 1) cf.innerHTML = `<div class="tt"><b>${L.total}</b><b>${money(sub())}${L.per}</b></div><p class="hint">${L.feeNote}</p><input class="inp" id="nm" placeholder="Adınız (istəyə bağlı)" autocomplete="name"><input class="inp" id="ad" placeholder="${L.addrPh || "Ünvan (istəyə bağlı)"}"><button class="btn wa wide" onclick="VD.send()">${ico.wa}<span>${L.send}</span></button>`;
  else cf.innerHTML = `<div class="tt"><b>${L.total}</b><b>${money(sub())}${L.per}</b></div><p class="hint">${L.feeNote}</p><a class="btn pri wide" href="#/checkout" onclick="VD.tog(0)">${L.checkout}</a><button class="btn line wide" onclick="VD.send()">${ico.wa}<span>${L.send}</span></button>`;
}
function reveal() {
  if (!("IntersectionObserver" in window)) { $$(".rv").forEach(e => e.classList.add("in")); return }
  const io = reveal.io || (reveal.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target) } }), { rootMargin: "0px 0px -8% 0px" }));
  const vh = innerHeight; $$(".rv:not(.in)").forEach(e => { const r = e.getBoundingClientRect(); if (r.top < vh && r.bottom > 0) e.classList.add("in"); else io.observe(e) });
}
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, "")), [r0, ...a] = h.split("/"); const r = r0 || "home";
  let v = V[r]; if (!v || (v.t && v.t > T)) v = V.home;
  if (r !== "item") { const s = $("#ld"); if (s) s.remove() }
  if (r !== "home") clearInterval(V.home.t);
  app.innerHTML = `<div class="view">${v.render(a)}</div>`;
  v.init && v.init(a);
  const cur = v === V.home ? "home" : r;
  $$("nav a").forEach(x => x.classList.toggle("on", x.dataset.r === cur || (cur === "item" && x.dataset.r === "catalog")));
  document.body.dataset.r = cur;
  document.body.classList.toggle("ovh", cur === "home" && OVH.includes(LK.hero));
  VD.closeAll(1);
  if (T >= 3 && v === V.home) splitH();
  reveal(); onScroll();
  if (route.n) window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" }); route.n = 1;
}
function splitH() { const h = $(".split"); if (!h || h.dataset.d) return; h.dataset.d = 1; let i = 0; h.innerHTML = h.innerHTML.split(/(<[^>]+>|\s+)/).map(t => !t || /^</.test(t) || /^\s+$/.test(t) ? t : `<span class="wd" style="--i:${i++}"><span>${t}</span></span>`).join("") }
function onScroll() { const hd = $("#hd"); if (hd) hd.classList.toggle("solid", scrollY > 40 || document.body.dataset.r !== "home") }

/* ---------- İctimai API (HTML onclick üçün) ---------- */
const VD = window.VD = {
  add: (id, o, q, cp) => add(id, o, q, cp), fav, toast, q: setQ, rm,
  tog(o) { document.body.classList.toggle("op", !!o); $("#cart").setAttribute("aria-hidden", !o) },
  closeAll(soft) { document.body.classList.remove("op", "so", "dr", "mo", "lo", "fo"); },
  send() { const nm = $("#nm") ? $("#nm").value.trim() : "", ad = $("#ad") ? $("#ad").value.trim() : ""; window.open(wa(basketMsg((nm ? `Ad: ${nm}` : "") + (ad ? `\n${L.addrLabel || "Ünvan"}: ${ad}` : ""))), "_blank", "noopener") },
  sort(v) { st.sort = v; upGrid() },
  st(k, v) { st[k] = v; clearTimeout(VD.st.t); VD.st.t = setTimeout(upGrid, 120) },
  tg(k, v) { st[k] = st[k].includes(v) ? st[k].filter(x => x !== v) : [...st[k], v]; upGrid() },
  reset() { st = { q: "", sort: "def", min: "", max: "", tags: [], cats: [] }; V.catalog.keep = true; route() },
  flt(o) { document.body.classList.toggle("fo", !!o) },
  srch(o) { document.body.classList.toggle("so", !!o); if (o) { setTimeout(() => $("#sq").focus(), 50); VD.sres($("#sq").value) } },
  sres(q) {
    q = q.trim().toLowerCase(); const r = q ? PV.filter(p => (p.name + " " + p.desc + " " + CATS[p.cat] + " " + p.tags.join(" ")).toLowerCase().includes(q)).slice(0, 8) : PV.filter(p => p.feat).slice(0, 4);
    $("#sr").innerHTML = (q ? "" : `<p class="hint">Populyar:</p>`) + (r.length ? r.map(p => `<a class="sri" href="#/item/${p.id}">${pic(p.img, p.name, 160)}<span><b>${esc(p.name)}</b><small>${CATS[p.cat]}</small></span><em>${priceStr(p)}</em></a>`).join("") : `<div class="empty">Heç nə tapılmadı.</div>`)
  },
  drw(o) { document.body.classList.toggle("dr", !!o) },
  pick(b) { $$(".chip", b.parentNode).forEach(x => x.classList.remove("on")); b.classList.add("on"); const p = byId(location.hash.split("/").pop()); if (p) $("#ipr").innerHTML = (() => { const o = VD.curOpts(); const tmp = { id: p.id, o }; const x = Object.assign({}, p, { price: linePrice(tmp) }); return priceTxt(x) })() },
  curOpts() { const o = {}; $$(".ochips").forEach(g => { const on = $(".chip.on", g); if (on) o[g.dataset.o] = on.dataset.v }); return o },
  iq(d) { V.item.q = Math.max(1, (V.item.q || 1) + d); $("#iq").textContent = V.item.q },
  addCur(id) { add(id, VD.curOpts(), V.item.q || 1); if (T >= 2) setTimeout(() => VD.tog(1), 250) },
  thumb(b, m) { $$(".thumbs button").forEach(x => x.classList.remove("on")); b.classList.add("on"); $("#mainimg").innerHTML = pic(m, "", 1200) },
  fv(k, v, re) { FV[k] = v; if (re || FIELDS.some(x => x.showIf && x.showIf[0] === k)) { const f = FIELDS.find(x => x.id === k || x.id + "_d" === k); rerenderForm() } else if (FIELDS.find(x => x.id === k && x.fees)) $("#sum").innerHTML = summaryHtml(T === 2 || STEP < 3) },
  coupon() { const v = $("#cp").value.trim().toUpperCase(); if (v === "DEMO10") { S.set("cp", v); toast("Promo kod tətbiq olundu") } else { S.set("cp", ""); toast("Promo kod etibarsızdır") } $("#sum").innerHTML = summaryHtml(1) },
  submit() { if (validate(FIELDS)) finish() },
  next() { const list = FIELDS.filter(f => (f.step || 1) === STEP); if (STEP < 3) { if (validate(list)) { STEP++; route() } } else finish() },
  back() { STEP = Math.max(1, STEP - 1); route() },
  quick(id) {
    const p = byId(id); if (!p) return;
    $("#mbox").innerHTML = `<button class="ib mx" onclick="VD.closeAll()" aria-label="Bağla">${ico.x}</button><div class="qvg">${pic(p.img, p.name, 900)}<div><span class="cm">${CATS[p.cat]}${p.meta ? " · " + esc(p.meta) : ""}</span><h3>${esc(p.name)}</h3><div class="pr big">${priceTxt(p)}</div><p class="desc">${esc(p.desc)}</p><div class="row">${p.opts && p.opts.length ? `<a class="btn pri" href="#/item/${p.id}">Seçimləri et</a>` : `<button class="btn pri" onclick="VD.add(${p.id});VD.closeAll()">${L.add}</button>`}<a class="btn line" href="#/item/${p.id}">Ətraflı</a></div></div></div>`;
    document.body.classList.add("mo");
  },
  lb(i) { const g = C.gallery || []; $("#lbi").src = U(g[i], 1800); document.body.classList.add("lo") },
  slide(n) { $$(".slides .sl").forEach((s, i) => s.classList.toggle("on", i === n)); $$(".hdots button").forEach((s, i) => s.classList.toggle("on", i === n)) },
  modal(html) { $("#mbox").innerHTML = `<button class="ib mx" onclick="VD.closeAll()" aria-label="Bağla">${ico.x}</button>` + html; document.body.classList.add("mo") }
};
function rerenderForm() {
  const f = $("#cof"); if (!f) return; const y = scrollY; const fg = $(".fgrid", f);
  if (fg) { const list = T === 2 ? FIELDS : FIELDS.filter(x => (x.step || 1) === STEP); fg.innerHTML = list.map(fieldHtml).join("") }
  $("#sum").innerHTML = summaryHtml(T === 2 || STEP < 3); window.scrollTo(0, y);
}
const E = window.VDE = { C, P, T, TN, L, money, pic, U, esc, add, toast, wa, go, ico, byId, card, grid, head, btnWa, eyebrow, CATS };

/* Başlat */
shell(); const app = $("#app"); drawB();
addEventListener("hashchange", route); addEventListener("scroll", onScroll, { passive: true });
addEventListener("keydown", e => { if (e.key === "Escape") VD.closeAll() });
route();
})();

</script>
</body>
